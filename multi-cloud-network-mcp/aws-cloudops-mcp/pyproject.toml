[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-cloudops-mcp"
version = "0.4.0"
description = "Production-quality, read-only Model Context Protocol (MCP) server for AWS cloud and network operations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "aws-cloudops-mcp contributors" }]
keywords = ["mcp", "aws", "cloud", "networking", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=2.0.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "moto[ec2,sts]>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "boto3-stubs[ec2,sts]>=1.35.0",
]

[project.scripts]
aws-cloudops-mcp = "aws_cloudops_mcp.server:main"

[project.urls]
Homepage = "https://github.com/maharshipendem/Multi-Cloud-Network-MCP/tree/main/multi-cloud-network-mcp/aws-cloudops-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_cloudops_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require real AWS credentials and network access (deselected by default)",
]
addopts = "-m 'not integration'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["aws_cloudops_mcp"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
