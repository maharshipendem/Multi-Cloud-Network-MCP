[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-network-mcp"
version = "0.2.0"
description = "Production-quality, read-only Model Context Protocol (MCP) server for Azure network operations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "azure-network-mcp contributors" }]
keywords = ["mcp", "azure", "cloud", "networking", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=2.0.0",
    "azure-identity>=1.19.0",
    "azure-mgmt-network>=28.0.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-subscription>=3.1.0",
    "azure-mgmt-privatedns>=1.1.0",
    "azure-mgmt-dnsresolver>=1.1.0",
    "azure-mgmt-monitor>=6.0.0",
    "azure-core>=1.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
azure-network-mcp = "azure_network_mcp.server:main"

[project.urls]
Homepage = "https://github.com/maharshipendem/Multi-Cloud-Network-MCP/tree/main/multi-cloud-network-mcp/azure-network-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_network_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require real Azure credentials and network access (deselected by default)",
]
addopts = "-m 'not integration'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["azure_network_mcp"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
