# Least-privilege custom IAM role for gcp-network-mcp.
#
# Grants only the read-only ("get"/"list"-verb) permissions this server's
# tools actually call -- never Owner, Editor, or a broad predefined
# Viewer role. Create it with:
#
#   gcloud iam roles create gcpNetworkMcpReader \
#     --project=YOUR_PROJECT_ID \
#     --file=gcp-custom-role.yaml
#
# ...or at the organization level (recommended for the hierarchical
# firewall policy tools, which are org/folder-scoped) with
# `--organization=YOUR_ORG_ID` in place of `--project`. Bind it to the
# service account this server runs as with a role binding scoped to
# exactly the projects/folders/organization it needs to read -- never a
# project-wide Owner/Editor grant.
#
# Every permission below follows GCP's documented "<service>.<resource>.get"/
# "<service>.<resource>.list" naming convention for the resource types this
# milestone's tools read. Verify this list against the current IAM
# permissions reference (https://cloud.google.com/iam/docs/permissions-reference)
# before granting in a production organization -- GCP occasionally
# introduces a permission split (e.g. a separate ".getHealth" or
# ".getStatus" permission alongside ".get") that a static list like this
# one cannot self-verify against a live project.
title: "GCP Network MCP Reader"
description: >-
  Read-only access to VPC networking resources for gcp-network-mcp:
  networks, subnetworks, routes, firewall rules/policies, instance
  connectivity metadata, addresses, load balancing resources, Cloud
  Router/NAT, VPC peering, Shared VPC relationships, Network Connectivity
  Center, HA/Classic VPN, Cloud Interconnect, Private Service Connect,
  private services access ranges, Cloud DNS, Packet Mirroring config,
  VPC Flow Logs config, Connectivity Tests, and bounded Cloud
  Logging/Monitoring read queries. Never grants create/update/delete on
  any resource.
stage: "GA"
includedPermissions:
  # Networks, subnetworks, routes
  - compute.networks.get
  - compute.networks.list
  - compute.subnetworks.get
  - compute.subnetworks.list
  - compute.routes.get
  - compute.routes.list

  # Firewall rules and policies (hierarchical + network-scoped)
  - compute.firewalls.get
  - compute.firewalls.list
  - compute.firewallPolicies.get
  - compute.firewallPolicies.list
  - compute.networkFirewallPolicies.get
  - compute.networkFirewallPolicies.list

  # Instance connectivity metadata
  - compute.instances.get
  - compute.instances.list

  # Reserved addresses
  - compute.addresses.get
  - compute.addresses.list
  - compute.globalAddresses.get
  - compute.globalAddresses.list

  # Load balancing: forwarding rules, target proxies, backend services
  - compute.forwardingRules.get
  - compute.forwardingRules.list
  - compute.globalForwardingRules.get
  - compute.globalForwardingRules.list
  - compute.targetHttpProxies.get
  - compute.targetHttpProxies.list
  - compute.targetHttpsProxies.get
  - compute.targetHttpsProxies.list
  - compute.backendServices.get
  - compute.backendServices.list
  - compute.regionBackendServices.get
  - compute.regionBackendServices.list

  # Cloud Router / Cloud NAT (NAT config is embedded in Router)
  - compute.routers.get
  - compute.routers.list

  # Shared VPC host/service-project discovery
  - compute.projects.get

  # Project/folder/organization discovery (gcp_list_permitted_projects)
  - resourcemanager.projects.get
  - resourcemanager.projects.list

  # --- Milestone 8: advanced transit/hybrid networking & diagnostics ---

  # Cloud Router BGP peer status/best-routes
  - compute.routers.getRouterStatus

  # Network Connectivity Center: hubs, spokes, groups, route tables/routes
  - networkconnectivity.hubs.get
  - networkconnectivity.hubs.list
  - networkconnectivity.hubs.getStatus
  - networkconnectivity.spokes.get
  - networkconnectivity.spokes.list
  - networkconnectivity.groups.get
  - networkconnectivity.groups.list
  - networkconnectivity.routeTables.get
  - networkconnectivity.routeTables.list
  - networkconnectivity.routes.get
  - networkconnectivity.routes.list

  # HA/Classic Cloud VPN gateways, tunnels, external VPN gateways
  - compute.vpnGateways.get
  - compute.vpnGateways.list
  - compute.vpnGateways.getStatus
  - compute.vpnTunnels.get
  - compute.vpnTunnels.list
  - compute.externalVpnGateways.get
  - compute.externalVpnGateways.list

  # Cloud Interconnect: interconnects, attachments, locations, diagnostics
  # (never grants access to pairing keys or shared secrets -- this server's
  # normalizers never read those fields even though `.get` would return them)
  - compute.interconnects.get
  - compute.interconnects.list
  - compute.interconnects.getDiagnostics
  - compute.interconnectAttachments.get
  - compute.interconnectAttachments.list
  - compute.interconnectLocations.get
  - compute.interconnectLocations.list

  # Private Service Connect: published services (producer) + consumer
  # endpoints (derived from forwarding rules, already covered above)
  - compute.serviceAttachments.get
  - compute.serviceAttachments.list

  # Private services access ranges (derived from Global Addresses with
  # purpose=VPC_PEERING, already covered by compute.globalAddresses.* above)

  # Cloud DNS: managed zones and record set summaries
  - dns.managedZones.get
  - dns.managedZones.list
  - dns.resourceRecordSets.get
  - dns.resourceRecordSets.list

  # Packet Mirroring configuration only -- never mirrored packet content
  - compute.packetMirrorings.get
  - compute.packetMirrorings.list

  # VPC Flow Logs configuration (Network Management API)
  - networkmanagement.vpcFlowLogsConfigs.get
  - networkmanagement.vpcFlowLogsConfigs.list
  - networkmanagement.organizationVpcFlowLogsConfigs.get
  - networkmanagement.organizationVpcFlowLogsConfigs.list

  # Network Management Connectivity Tests -- reads existing tests and their
  # last-computed result only; this server never creates/reruns a test, so
  # no `.create`/`.rerun`/`.update`/`.delete` permission is granted.
  - networkmanagement.connectivitytests.get
  - networkmanagement.connectivitytests.list

  # Cloud Logging / Cloud Monitoring: bounded, explicit-opt-in read queries
  # only (gcp_query_logs/gcp_query_metrics enforce a narrow time window and
  # result cap regardless of caller input -- see Settings.max_log_entries /
  # max_log_query_window_hours / max_time_series_points /
  # max_metric_query_window_hours). No write/admin permission is granted.
  - logging.logEntries.list
  - monitoring.timeSeries.list
