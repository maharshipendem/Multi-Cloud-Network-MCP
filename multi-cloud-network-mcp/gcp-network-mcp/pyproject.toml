[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcp-network-mcp"
version = "0.2.0"
description = "Production-quality, read-only Model Context Protocol (MCP) server for Google Cloud network operations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "gcp-network-mcp contributors" }]
keywords = ["mcp", "gcp", "google-cloud", "cloud", "networking", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=2.0.0",
    "google-auth>=2.35.0",
    "google-cloud-compute>=1.19.0",
    "google-cloud-resource-manager>=1.12.0",
    "google-cloud-network-connectivity>=2.10.0",
    "google-cloud-network-management>=1.20.0",
    "google-cloud-dns>=0.35.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-monitoring>=2.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
gcp-network-mcp = "gcp_network_mcp.server:main"

[project.urls]
Homepage = "https://github.com/maharshipendem/Multi-Cloud-Network-MCP/tree/main/multi-cloud-network-mcp/gcp-network-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/gcp_network_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require real GCP credentials and network access (deselected by default)",
]
addopts = "-m 'not integration'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["gcp_network_mcp"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true

# google-cloud-dns ships no py.typed marker (unlike every other GCP client
# library this project uses) -- it's the one hand-written, pre-gapic client
# in this codebase's dependency set, not a gap in our own type coverage.
[[tool.mypy.overrides]]
module = "google.cloud.dns.*"
ignore_missing_imports = true

# google.logging.type.log_severity_pb2 (the well-known LogSeverity enum,
# pulled in transitively by google-cloud-logging) ships no py.typed marker.
[[tool.mypy.overrides]]
module = "google.logging.type.*"
ignore_missing_imports = true
