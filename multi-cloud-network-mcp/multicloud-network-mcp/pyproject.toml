[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multicloud-network-mcp"
version = "1.0.0"
description = "Versioned, vendor-neutral network contracts (JSON Schema 2020-12 + typed Pydantic models) shared by the AWS/Azure/GCP network MCP servers -- no runtime coupling, no cloud SDKs, no orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "multicloud-network-mcp contributors" }]
keywords = ["mcp", "multi-cloud", "contracts", "json-schema", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "pydantic>=2.7.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-jsonschema>=4.23.0",
]

[project.scripts]
multicloud-contracts = "multicloud_network_mcp.contracts.__main__:main"

[project.urls]
Homepage = "https://github.com/maharshipendem/Multi-Cloud-Network-MCP/tree/main/multi-cloud-network-mcp/multicloud-network-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/multicloud_network_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "contracts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["multicloud_network_mcp"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
